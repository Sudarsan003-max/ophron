services:
  wordpress:
    image: wordpress:latest
    container_name: ophron-wordpress
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ophron_user
      WORDPRESS_DB_PASSWORD: ophron_password
      WORDPRESS_DB_NAME: ophron_db
    volumes:
      - wp_data:/var/www/html
      - ./ophron-theme:/var/www/html/wp-content/themes/ophron-theme
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: ophron-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ophron_root_password
      MYSQL_DATABASE: ophron_db
      MYSQL_USER: ophron_user
      MYSQL_PASSWORD: ophron_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_data:
  db_data:
